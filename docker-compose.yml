version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: facturador-db
    environment:
      POSTGRES_USER: facturador_user
      POSTGRES_PASSWORD: facturador_password
      POSTGRES_DB: facturador
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
